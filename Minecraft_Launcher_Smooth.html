        /* Launcher Container */
        .launcher-container {
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #3c3c3c;
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.05);
            animation: containerFloat 4s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0) translateZ(0); }
            50% { transform: translateY(-6px) translateZ(0); }
        }

        /* App Logo Header */
        .app-logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 25px;
        }

        .app-logo {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            border: 3px solid #5c4033;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            animation: logoPulse 3s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1) translateZ(0); box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
            50% { transform: scale(1.05) translateZ(0); box-shadow: 0 12px 25px rgba(92, 64, 51, 0.4); }
        }

        /* Animated Floating Texts */
        .floating-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.9);
            animation: textFloat1 3.5s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes textFloat1 {
            0%, 100% { transform: translateY(0) translateZ(0); text-shadow: 0 4px 10px rgba(0,0,0,0.9); }
            50% { transform: translateY(-4px) translateZ(0); text-shadow: 0 8px 20px rgba(92, 184, 92, 0.4); }
        }

        .floating-subtitle {
            font-size: 1.05rem;
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 35px;
            animation: textFloat2 4s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes textFloat2 {
            0%, 100% { transform: translateY(0) translateZ(0); }
            50% { transform: translateY(-3px) translateZ(0); }
        }

        /* Animated Launch Button */
        .launch-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 16px 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        .launch-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(45deg) translateX(-100%);
            transition: transform 0.5s ease;
        }

        .launch-btn:hover {
            background: linear-gradient(135deg, #66BB6A 0%, #43A047 100%);
            transform: translateY(-2px) translateZ(0);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.6);
        }

        .launch-btn:hover::after {
            transform: rotate(45deg) translateX(100%);
        }

        .launch-btn:active {
            transform: translateY(1px) translateZ(0);
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
        }

        /* Dark Gray Loading Screen Overlay */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity;
        }

        #loading-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333333;
            border-top: 6px solid #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
            will-change: transform;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 1.2rem;
            color: #dddddd;
            font-weight: 600;
            letter-spacing: 1px;
            animation: pulseText 1.2s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .loader-progress {
            width: 250px;
            height: 6px;
            background: #333333;
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            transform: translateZ(0);
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: #4CAF50;
            border-radius: 3px;
            transition: width 0.08s linear;
            will-change: width;
        }

        /* Footer Status */
        .footer-status {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            color: #777777;
        }
    </style>
</head>

    <script>
        function launchGame() {
            const loadingScreen = document.getElementById('loading-screen');
            const loaderBar = document.getElementById('loaderBar');
            const loaderStatusText = document.getElementById('loaderStatusText');
            
            loadingScreen.classList.add('active');

            const statuses = [
                "Loading Java Runtime Environment...",
                "Mounting Virtual File System...",
                "Injecting Eaglercraft 26.3 Client...",
                "Establishing Connection...",
                "Launching Minecraft..."
            ];

            let progress = 0;
            let statusIndex = 0;
            
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 10) + 6;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    loaderStatusText.textContent = "Ready! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "https://eaglercraft.playclassicgame.com/games/26.3/hicraft_26.3.html?v=20261030-03";
                    }, 300);
                }
                loaderBar.style.width = progress + '%';

                if (progress > (statusIndex + 1) * 20 && statusIndex < statuses.length - 1) {
                    statusIndex++;
                    loaderStatusText.textContent = statuses[statusIndex];
                }
            }, 50);
        }
    </script>
